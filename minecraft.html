<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>我的世界 · 原版风格增强网页版</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #1a1a2e; touch-action: none; }
        canvas { display: block; }

        /* 准星 */
        #crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.9); font-size: 28px; font-weight: 100;
            text-shadow: 0 0 6px #000; pointer-events: none; z-index: 10;
            letter-spacing: -4px; user-select: none;
        }

        /* HUD信息 */
        #hud {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.65); color: #eee; padding: 6px 20px;
            border-radius: 30px; font-size: 13px; z-index: 30;
            border: 1px solid rgba(255,255,255,0.15); pointer-events: none;
            white-space: nowrap; backdrop-filter: blur(4px);
        }
        #timeDisplay { color: #ffd966; }

        /* 底部工具栏 (9格) */
        #toolbar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4px; z-index: 20;
            background: rgba(0,0,0,0.7); padding: 6px 12px;
            border-radius: 16px; backdrop-filter: blur(6px);
            border: 2px solid rgba(255,255,255,0.3);
        }
        .slot {
            width: 44px; height: 44px;
            background: rgba(60,60,60,0.6);
            border: 2px solid #555;
            border-radius: 6px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.1s;
            image-rendering: pixelated;
        }
        .slot.active {
            border-color: #ffaa00;
            background: rgba(255,170,0,0.25);
            box-shadow: 0 0 15px rgba(255,170,0,0.4);
        }
        .slot canvas { width: 32px; height: 32px; image-rendering: pixelated; }
        .slot span { color: #fff; font-size: 10px; text-shadow: 0 0 4px #000; }

        /* 控制提示 */
        #controls-hint {
            position: fixed; bottom: 90px; left: 0; right: 0;
            text-align: center; color: rgba(255,255,255,0.35);
            font-size: 11px; z-index: 5; pointer-events: none;
            text-shadow: 0 2px 6px #000;
        }

        @media (max-width: 600px) {
            .slot { width: 36px; height: 36px; }
            .slot canvas { width: 26px; height: 26px; }
            #hud { font-size: 11px; padding: 4px 12px; }
        }
    </style>
</head>
<body>

    <div id="crosshair">✚</div>
    <div id="hud">
        ⏳ <span id="timeDisplay">正午</span> &nbsp;|&nbsp; 🧱 <span id="blockCount">0</span>
    </div>
    <div id="controls-hint">
        WASD移动 · 空格上升 · Shift下降 · 鼠标拖拽视角 · 左键拆除 · 右键放置 · 数字键1-9选方块
    </div>
    <div id="toolbar"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 40, 70);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 20, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.9;
        document.body.prepend(renderer.domElement);

        // --- 灯光 (可随昼夜变化) ---
        const ambientLight = new THREE.AmbientLight(0x8899bb, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(50, 80, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 120;
        sunLight.shadow.camera.left = -40;
        sunLight.shadow.camera.right = 40;
        sunLight.shadow.camera.top = 40;
        sunLight.shadow.camera.bottom = -40;
        scene.add(sunLight);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a5a3a, 0.4);
        scene.add(hemiLight);

        // --- 核心数据 ---
        const blocks = {}; // key -> mesh
        const blockSize = 1;
        const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);

        // --- 方块类型定义 (原版风格) ---
        const BLOCK_TYPES = {
            GRASS: 'grass',
            DIRT: 'dirt',
            STONE: 'stone',
            COBBLESTONE: 'cobblestone',
            OAK_LOG: 'oak_log',
            OAK_LEAVES: 'oak_leaves',
            BIRCH_LOG: 'birch_log',
            BIRCH_LEAVES: 'birch_leaves',
            SPRUCE_LOG: 'spruce_log',
            SPRUCE_LEAVES: 'spruce_leaves',
            SAND: 'sand',
            PLANKS: 'planks',
            COAL_ORE: 'coal_ore',
            IRON_ORE: 'iron_ore',
            GOLD_ORE: 'gold_ore',
            DIAMOND_ORE: 'diamond_ore',
            FLOWER: 'flower',
            TALL_GRASS: 'tall_grass'
        };

        // 纹理生成 (16x16 像素风格)
        function createCanvasTexture(width, height, drawFn) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            drawFn(ctx);
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        // 生成所有纹理
        function generateTextures() {
            const tex = {};

            // 草
            tex.grassTop = createCanvasTexture(16, 16, ctx => {
                ctx.fillStyle = '#7c9c5c'; ctx.fillRect(0,0,16,16);
                for(let i=0;i<60;i++){ ctx.fillStyle = i%2?'#8cb06c':'#6c8c4c'; ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1,1); }
            });
            tex.grassSide = createCanvasTexture(16, 16, ctx => {
                ctx.fillStyle = '#8b6b4b'; ctx.fillRect(0,0,16,16);
                for(let i=0;i<40;i++){ ctx.fillStyle = '#7a5a3a'; ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1,1); }
                ctx.fillStyle = '#7c9c5c';
                for(let x=0;x<16;x++) for(let y=0;y<4;y++) if((x+y)%2===0) ctx.fillRect(x,y,1,1);
            });
            tex.grassBottom = createCanvasTexture(16, 16, ctx => {
                ctx.fillStyle = '#8b6b4b'; ctx.fillRect(0,0,16,16);
                for(let i=0;i<30;i++){ ctx.fillStyle = '#7a5a3a'; ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1,1); }
            });

            // 泥土
            tex.dirt = createCanvasTexture(16,16, ctx => {
                ctx.fillStyle = '#8b6b4b'; ctx.fillRect(0,0,16,16);
                for(let i=0;i<50;i++){ ctx.fillStyle = i%3?'#7a5a3a':'#9c7c5c'; ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1,1); }
            });

            // 石头
            tex.stone = createCanvasTexture(16,16, ctx => {
                ctx.fillStyle = '#8a8a8a'; ctx.fillRect(0,0,16,16);
                for(let i=0;i<60;i++){ ctx.fillStyle = i%2?'#9a9a9a':'#7a7a7a'; ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1,1); }
            });

            // 圆石 (更粗糙)
            tex.cobblestone = createCanvasTexture(16,16, ctx => {
                ctx.fillStyle = '#7a7a7a'; ctx.fillRect(0,0,16,16);
                for(let i=0;i<80;i++){ ctx.fillStyle = i%3?'#8a8a8a':'#6a6a6a'; ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 2,1); }
            });

            // 橡木原木 (顶/侧)
            tex.oakLogTop = createCanvasTexture(16,16, ctx => {
                ctx.fillStyle = '#b88a5a'; ctx.fillRect(0,0,16,16);
                for(let r=2;r<8;r+=2){ ctx.strokeStyle = '#a07a4a'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(8,8,r*1.3,0,Math.PI*2); ctx.stroke(); }
            });
            tex.oakLogSide = createCanvasTexture(16,16, ctx => {
                ctx.fillStyle = '#c89a6a'; ctx.fillRect(0,0,16,16);
                for(let i=0;i<16;i++){ ctx.fillStyle = i%2?'#b08858':'#d8aa7a'; ctx.fillRect(i,0,1,16); }
                for(let i=0;i<10;i++){ ctx.fillStyle = '#a07848'; ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1,2); }
            });

            // 白桦木
            tex.birchLogTop = createCanvasTexture(16,16, ctx => {
                ctx.fillStyle = '#e8d5b0'; ctx.fillRect(0,0,16,16);
                for(let r=2;r<8;r+=2){ ctx.strokeStyle = '#d0c0a0'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(8,8,r*1.3,0,Math.PI*2); ctx.stroke(); }
            });
            tex.birchLogSide = createCanvasTexture(16,16, ctx => {
                ctx.fillStyle = '#f0e0c0'; ctx.fillRect(0,0,16,16);
                for(let i=0;i<20;i++){ ctx.fillStyle = i%2?'#e0d0b0':'#f8e8d0'; ctx.fillRect(i*2%16,0,1,16); }
            });

            // 云杉木 (深色)
            tex.spruceLogTop = createCanvasTexture(16,16, ctx => {
                ctx.fillStyle = '#7a5a3a'; ctx.fillRect(0,0,16,16);
                for(let r=2;r<8;r+=2){ ctx.strokeStyle = '#5a4a2a'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(8,8,r*1.3,0,Math.PI*2); ctx.stroke(); }
            });
            tex.spruceLogSide = createCanvasTexture(16,16, ctx => {
                ctx.fillStyle = '#8a6a4a'; ctx.fillRect(0,0,16,16);
                for(let i=0;i<16;i++){ ctx.fillStyle = i%2?'#7a5a3a':'#9a7a5a'; ctx.fillRect(i,0,1,16); }
            });

            // 树叶 (半透明)
            function genLeaf(baseColor, variation) {
                return createCanvasTexture(16,16, ctx => {
                    ctx.fillStyle = baseColor; ctx.fillRect(0,0,16,16);
                    for(let i=0;i<100;i++){ 
                        const alpha = Math.random()>0.3 ? 1 : 0.3;
                        ctx.fillStyle = `rgba(${variation}, ${alpha})`;
                        ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1,1);
                    }
                });
            }
            tex.oakLeaves = genLeaf('#2d7a2d', '60,140,60');
            tex.birchLeaves = genLeaf('#5a9a4a', '90,170,70');
            tex.spruceLeaves = genLeaf('#1a5a1a', '30,90,30');

            // 沙子
            tex.sand = createCanvasTexture(16,16, ctx => {
                ctx.fillStyle = '#dbb87a'; ctx.fillRect(0,0,16,16);
                for(let i=0;i<40;i++){ ctx.fillStyle = i%2?'#c8a86a':'#e8c88a'; ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1,1); }
            });

            // 木板
            tex.planks = createCanvasTexture(16,16, ctx => {
                ctx.fillStyle = '#c8a06a'; ctx.fillRect(0,0,16,16);
                for(let i=0;i<16;i+=2){ ctx.fillStyle = '#b8905a'; ctx.fillRect(0,i,16,1); }
                for(let i=0;i<16;i+=4){ ctx.fillStyle = '#d8b07a'; ctx.fillRect(i,0,1,16); }
            });

            // 矿石 (在石头纹理上加色块)
            function oreTexture(overlayColor) {
                return createCanvasTexture(16,16, ctx => {
                    ctx.fillStyle = '#8a8a8a'; ctx.fillRect(0,0,16,16);
                    for(let i=0;i<50;i++){ ctx.fillStyle = i%2?'#9a9a9a':'#7a7a7a'; ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1,1); }
                    for(let i=0;i<8;i++){ ctx.fillStyle = overlayColor; ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 2,2); }
                });
            }
            tex.coalOre = oreTexture('#333333');
            tex.ironOre = oreTexture('#cc9966');
            tex.goldOre = oreTexture('#ffcc33');
            tex.diamondOre = oreTexture('#66ccff');

            // 花 (十字交叉贴图 - 用canvas画花朵形状)
            tex.flower = createCanvasTexture(16,16, ctx => {
                ctx.clearRect(0,0,16,16);
                ctx.fillStyle = '#ff5555'; ctx.beginPath(); ctx.arc(8,8,6,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(4,4,3,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(12,4,3,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(4,12,3,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(12,12,3,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#228822'; ctx.fillRect(6,0,4,4);
                ctx.fillRect(6,12,4,4);
            });
            tex.tallGrass = createCanvasTexture(16,16, ctx => {
                ctx.clearRect(0,0,16,16);
                ctx.fillStyle = '#4a8a3a';
                for(let i=0;i<8;i++){ ctx.fillRect(i*2+1, 2+Math.sin(i)*2, 1, 12+Math.cos(i)*3); }
            });

            return tex;
        }

        const tex = generateTextures();

        // --- 材质工厂 ---
        function makeMaterials(type) {
            const makeMat = (map) => new THREE.MeshLambertMaterial({ map, shadowSide: THREE.FrontSide });
            switch(type) {
                case BLOCK_TYPES.GRASS:
                    return [makeMat(tex.grassSide), makeMat(tex.grassSide), makeMat(tex.grassTop), makeMat(tex.grassBottom), makeMat(tex.grassSide), makeMat(tex.grassSide)];
                case BLOCK_TYPES.DIRT: return Array(6).fill(makeMat(tex.dirt));
                case BLOCK_TYPES.STONE: return Array(6).fill(makeMat(tex.stone));
                case BLOCK_TYPES.COBBLESTONE: return Array(6).fill(makeMat(tex.cobblestone));
                case BLOCK_TYPES.OAK_LOG:
                    return [makeMat(tex.oakLogSide), makeMat(tex.oakLogSide), makeMat(tex.oakLogTop), makeMat(tex.oakLogTop), makeMat(tex.oakLogSide), makeMat(tex.oakLogSide)];
                case BLOCK_TYPES.BIRCH_LOG:
                    return [makeMat(tex.birchLogSide), makeMat(tex.birchLogSide), makeMat(tex.birchLogTop), makeMat(tex.birchLogTop), makeMat(tex.birchLogSide), makeMat(tex.birchLogSide)];
                case BLOCK_TYPES.SPRUCE_LOG:
                    return [makeMat(tex.spruceLogSide), makeMat(tex.spruceLogSide), makeMat(tex.spruceLogTop), makeMat(tex.spruceLogTop), makeMat(tex.spruceLogSide), makeMat(tex.spruceLogSide)];
                case BLOCK_TYPES.OAK_LEAVES:
                    return Array(6).fill(new THREE.MeshLambertMaterial({ map: tex.oakLeaves, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
                case BLOCK_TYPES.BIRCH_LEAVES:
                    return Array(6).fill(new THREE.MeshLambertMaterial({ map: tex.birchLeaves, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
                case BLOCK_TYPES.SPRUCE_LEAVES:
                    return Array(6).fill(new THREE.MeshLambertMaterial({ map: tex.spruceLeaves, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
                case BLOCK_TYPES.SAND: return Array(6).fill(makeMat(tex.sand));
                case BLOCK_TYPES.PLANKS: return Array(6).fill(makeMat(tex.planks));
                case BLOCK_TYPES.COAL_ORE: return Array(6).fill(makeMat(tex.coalOre));
                case BLOCK_TYPES.IRON_ORE: return Array(6).fill(makeMat(tex.ironOre));
                case BLOCK_TYPES.GOLD_ORE: return Array(6).fill(makeMat(tex.goldOre));
                case BLOCK_TYPES.DIAMOND_ORE: return Array(6).fill(makeMat(tex.diamondOre));
                case BLOCK_TYPES.FLOWER:
                case BLOCK_TYPES.TALL_GRASS:
                    // 非方块，特殊处理
                    return null;
                default: return Array(6).fill(new THREE.MeshLambertMaterial({ color: 0xff00ff }));
            }
        }

        // --- 世界存储 ---
        function getKey(x,y,z) { return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`; }

        function addBlock(x, y, z, type) {
            x = Math.round(x); y = Math.round(y); z = Math.round(z);
            const key = getKey(x,y,z);
            if (blocks[key]) return;
            if (type === BLOCK_TYPES.FLOWER || type === BLOCK_TYPES.TALL_GRASS) {
                // 花草用精灵或十字平面，此处简单用一个小平面
                const mat = new THREE.SpriteMaterial({ 
                    map: type === BLOCK_TYPES.FLOWER ? tex.flower : tex.tallGrass, 
                    transparent: true, 
                    depthTest: true,
                    depthWrite: false,
                    rotation: Math.random() * Math.PI
                });
                const sprite = new THREE.Sprite(mat);
                sprite.position.set(x+0.5, y+0.5, z+0.5);
                sprite.scale.set(0.6, 0.6, 1);
                scene.add(sprite);
                blocks[key] = sprite;
                return;
            }
            const materials = makeMaterials(type);
            if (!materials) return;
            const mesh = new THREE.Mesh(geometry, materials);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            blocks[key] = mesh;
        }

        function removeBlock(x, y, z) {
            x = Math.round(x); y = Math.round(y); z = Math.round(z);
            const key = getKey(x,y,z);
            if (blocks[key]) {
                scene.remove(blocks[key]);
                delete blocks[key];
            }
        }

        function getBlock(x,y,z) {
            return blocks[getKey(x,y,z)];
        }

        // --- 地形生成 (使用多频率正弦波模拟噪声) ---
        function noise2D(x, z) {
            // 简单噪声叠加
            return Math.sin(x * 0.15) * Math.cos(z * 0.13) * 2 +
                   Math.sin(x * 0.05 + z * 0.07) * 4 +
                   Math.cos(x * 0.25 - z * 0.19) * 1.5;
        }

        function generateWorld() {
            const size = 32; // 半径
            const heightScale = 6;
            const seaLevel = 0;

            // 先清空旧世界（如果有）
            for (const key in blocks) {
                scene.remove(blocks[key]);
                delete blocks[key];
            }

            // 遍历列
            for (let x = -size; x <= size; x++) {
                for (let z = -size; z <= size; z++) {
                    // 计算高度
                    let h = noise2D(x, z) * heightScale + 2;
                    h = Math.floor(h);
                    // 生物群系简单判断（基于位置）
                    const biome = (Math.abs(x) < 12 && Math.abs(z) < 12) ? 'forest' : 
                                  (Math.abs(x + z) % 20 < 5 ? 'desert' : 'plains');

                    // 从底层到顶层
                    for (let y = -2; y <= h; y++) {
                        let type;
                        if (y === h) {
                            // 表层
                            if (biome === 'desert' && y >= seaLevel) {
                                type = BLOCK_TYPES.SAND;
                            } else if (y >= seaLevel) {
                                type = BLOCK_TYPES.GRASS;
                            } else {
                                type = BLOCK_TYPES.DIRT;
                            }
                        } else if (y > h - 3 && y >= seaLevel) {
                            type = BLOCK_TYPES.DIRT;
                        } else {
                            type = BLOCK_TYPES.STONE;
                        }
                        // 矿石 (在石头层随机)
                        if (type === BLOCK_TYPES.STONE && y < 4) {
                            const rand = Math.random();
                            if (rand < 0.03) type = BLOCK_TYPES.DIAMOND_ORE;
                            else if (rand < 0.08) type = BLOCK_TYPES.GOLD_ORE;
                            else if (rand < 0.15) type = BLOCK_TYPES.IRON_ORE;
                            else if (rand < 0.25) type = BLOCK_TYPES.COAL_ORE;
                        }
                        addBlock(x, y, z, type);
                    }

                    // 在草地表面随机放置花草
                    if (h >= seaLevel) {
                        const topBlock = getBlock(x, h, z);
                        if (topBlock && topBlock.material && topBlock.material.map === tex.grassTop) {
                            if (Math.random() < 0.08) {
                                addBlock(x, h+1, z, BLOCK_TYPES.FLOWER);
                            } else if (Math.random() < 0.10) {
                                addBlock(x, h+1, z, BLOCK_TYPES.TALL_GRASS);
                            }
                        }
                    }
                }
            }

            // 生成树木 (在森林区域)
            for (let x = -size+2; x <= size-2; x+=3) {
                for (let z = -size+2; z <= size-2; z+=3) {
                    if (Math.random() < 0.15 && Math.abs(x) < 14 && Math.abs(z) < 14) {
                        const h = Math.floor(noise2D(x, z) * heightScale + 2);
                        if (h >= seaLevel) {
                            const topBlock = getBlock(x, h, z);
                            if (topBlock && topBlock.material && topBlock.material.map === tex.grassTop) {
                                // 随机树种类
                                const treeType = Math.random() < 0.33 ? 'oak' : (Math.random() < 0.5 ? 'birch' : 'spruce');
                                generateTree(x, h+1, z, treeType);
                            }
                        }
                    }
                }
            }
        }

        // --- 生成不同种类的树 ---
        function generateTree(x, y, z, type) {
            const logType = type === 'oak' ? BLOCK_TYPES.OAK_LOG : (type === 'birch' ? BLOCK_TYPES.BIRCH_LOG : BLOCK_TYPES.SPRUCE_LOG);
            const leafType = type === 'oak' ? BLOCK_TYPES.OAK_LEAVES : (type === 'birch' ? BLOCK_TYPES.BIRCH_LEAVES : BLOCK_TYPES.SPRUCE_LEAVES);
            const height = type === 'spruce' ? 6 : 5;

            // 树干
            for (let i = 0; i < height; i++) {
                addBlock(x, y+i, z, logType);
            }
            // 树叶 (球形)
            const leafStart = height - 3;
            for (let dy = leafStart; dy < height; dy++) {
                const radius = dy === height-1 ? 1 : (dy === leafStart ? 2 : 3);
                for (let dx = -radius; dx <= radius; dx++) {
                    for (let dz = -radius; dz <= radius; dz++) {
                        if (dx*dx+dz*dz <= radius*radius+1) {
                            const lx = x+dx, lz = z+dz;
                            if (!getBlock(lx, y+dy, lz)) {
                                addBlock(lx, y+dy, lz, leafType);
                            }
                        }
                    }
                }
            }
            // 顶部尖叶 (云杉)
            if (type === 'spruce') {
                addBlock(x, y+height, z, leafType);
                addBlock(x+1, y+height-1, z, leafType);
                addBlock(x-1, y+height-1, z, leafType);
                addBlock(x, y+height-1, z+1, leafType);
                addBlock(x, y+height-1, z-1, leafType);
            }
        }

        // --- 生成世界 ---
        generateWorld();

        // --- 掉落物系统 (简单) ---
        const drops = [];

        function spawnDrop(x, y, z, blockType) {
            const color = 0xffffff;
            const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const mat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x+0.5, y+0.8, z+0.5);
            mesh.userData = { life: 120, vy: 0.05 };
            scene.add(mesh);
            drops.push(mesh);
        }

        // --- 玩家控制 (飞行模式) ---
        let isLocked = false;
        let yaw = 0, pitch = 0;
        const euler = new THREE.Euler(0,0,0,'YXZ');
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const clock = new THREE.Clock();

        // 键盘
        const keys = { w:false, a:false, s:false, d:false, space:false, shift:false };

        document.addEventListener('keydown', e => {
            switch(e.code) {
                case 'KeyW': keys.w = true; e.preventDefault(); break;
                case 'KeyA': keys.a = true; e.preventDefault(); break;
                case 'KeyS': keys.s = true; e.preventDefault(); break;
                case 'KeyD': keys.d = true; e.preventDefault(); break;
                case 'Space': keys.space = true; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift = true; e.preventDefault(); break;
                case 'Digit1': selectSlot(0); break;
                case 'Digit2': selectSlot(1); break;
                case 'Digit3': selectSlot(2); break;
                case 'Digit4': selectSlot(3); break;
                case 'Digit5': selectSlot(4); break;
                case 'Digit6': selectSlot(5); break;
                case 'Digit7': selectSlot(6); break;
                case 'Digit8': selectSlot(7); break;
                case 'Digit9': selectSlot(8); break;
            }
        });
        document.addEventListener('keyup', e => {
            switch(e.code) {
                case 'KeyW': keys.w = false; e.preventDefault(); break;
                case 'KeyA': keys.a = false; e.preventDefault(); break;
                case 'KeyS': keys.s = false; e.preventDefault(); break;
                case 'KeyD': keys.d = false; e.preventDefault(); break;
                case 'Space': keys.space = false; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift = false; e.preventDefault(); break;
            }
        });

        // 鼠标/触屏视角
        function onMouseMove(event) {
            if (!isLocked) return;
            const movX = event.movementX || 0;
            const movY = event.movementY || 0;
            yaw -= movX * 0.002;
            pitch -= movY * 0.002;
            pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            euler.set(pitch, yaw, 0);
            camera.quaternion.setFromEuler(euler);
        }
        document.addEventListener('mousemove', onMouseMove);

        renderer.domElement.addEventListener('click', () => {
            if (!isLocked) renderer.domElement.requestPointerLock?.();
        });
        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === renderer.domElement;
        });

        // 触摸旋转 (手机)
        let touchX = 0, touchY = 0, isTouching = false;
        renderer.domElement.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.touches[0];
            if (t) { touchX = t.clientX; touchY = t.clientY; isTouching = true; }
        }, { passive: false });
        renderer.domElement.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!isTouching || e.touches.length!==1) return;
            const t = e.touches[0];
            const dx = t.clientX - touchX;
            const dy = t.clientY - touchY;
            touchX = t.clientX; touchY = t.clientY;
            yaw -= dx * 0.005;
            pitch -= dy * 0.005;
            pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            euler.set(pitch, yaw, 0);
            camera.quaternion.setFromEuler(euler);
        }, { passive: false });
        renderer.domElement.addEventListener('touchend', e => {
            e.preventDefault();
            isTouching = false;
            // 轻触执行交互
            if (e.changedTouches.length === 1) {
                handleInteraction();
            }
        }, { passive: false });

        // --- 交互 (放置/拆除) ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2(0,0);
        let currentSlot = 0;
        const blockList = [
            BLOCK_TYPES.GRASS,
            BLOCK_TYPES.DIRT,
            BLOCK_TYPES.STONE,
            BLOCK_TYPES.COBBLESTONE,
            BLOCK_TYPES.OAK_LOG,
            BLOCK_TYPES.PLANKS,
            BLOCK_TYPES.SAND,
            BLOCK_TYPES.COAL_ORE,
            BLOCK_TYPES.DIAMOND_ORE
        ];

        function handleInteraction(mode) {
            // mode: 'remove' or 'place', 如果未指定则根据鼠标按钮自动判断
            raycaster.setFromCamera(pointer, camera);
            const meshes = Object.values(blocks).filter(m => m.isMesh);
            const intersects = raycaster.intersectObjects(meshes, false);
            if (intersects.length > 0) {
                const hit = intersects[0];
                const obj = hit.object;
                const pos = obj.position;
                const x = Math.round(pos.x);
                const y = Math.round(pos.y);
                const z = Math.round(pos.z);

                if (mode === 'remove' || (mode === undefined && currentMode === 'remove')) {
                    if (y > -1) { // 保护基岩层
                        removeBlock(x, y, z);
                        spawnDrop(x, y, z, 'stone');
                    }
                } else {
                    const normal = hit.face.normal;
                    const nx = Math.round(x + normal.x);
                    const ny = Math.round(y + normal.y);
                    const nz = Math.round(z + normal.z);
                    // 不能放在玩家位置附近
                    const dist = new THREE.Vector3(nx, ny, nz).distanceTo(camera.position);
                    if (dist > 1.5) {
                        const type = blockList[currentSlot] || BLOCK_TYPES.GRASS;
                        addBlock(nx, ny, nz, type);
                    }
                }
            }
        }

        let currentMode = 'remove'; // 'remove' or 'place'

        // 鼠标事件
        renderer.domElement.addEventListener('mousedown', e => {
            if (!isLocked) return;
            if (e.button === 0) { currentMode = 'remove'; handleInteraction('remove'); }
            else if (e.button === 2) { currentMode = 'place'; handleInteraction('place'); }
        });
        renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

        // 键盘 Q 切换模式
        document.addEventListener('keydown', e => {
            if (e.key === 'q' || e.key === 'Q') {
                currentMode = (currentMode === 'remove' ? 'place' : 'remove');
                updateModeUI();
            }
        });

        // --- 工具栏 UI ---
        const toolbar = document.getElementById('toolbar');
        const slotElements = [];

        function buildToolbar() {
            toolbar.innerHTML = '';
            blockList.forEach((type, idx) => {
                const slot = document.createElement('div');
                slot.className = 'slot' + (idx === currentSlot ? ' active' : '');
                // 生成缩略图
                const canvas = document.createElement('canvas');
                canvas.width = 16; canvas.height = 16;
                const ctx = canvas.getContext('2d');
                // 简单绘制方块颜色 (或复制纹理)
                const mat = makeMaterials(type);
                if (mat && mat[0] && mat[0].map) {
                    ctx.drawImage(mat[0].map.image, 0, 0, 16, 16);
                } else {
                    ctx.fillStyle = '#888'; ctx.fillRect(0,0,16,16);
                }
                slot.appendChild(canvas);
                slot.addEventListener('click', () => selectSlot(idx));
                toolbar.appendChild(slot);
                slotElements.push(slot);
            });
        }
        buildToolbar();

        function selectSlot(idx) {
            if (idx < 0 || idx >= blockList.length) return;
            currentSlot = idx;
            slotElements.forEach((el, i) => el.className = 'slot' + (i === idx ? ' active' : ''));
        }

        function updateModeUI() {
            // 简单反馈
            document.getElementById('hud').innerHTML += ` <span style="color:${currentMode==='remove'?'#ff6666':'#66ff66'};">[${currentMode==='remove'?'破坏':'放置'}]</span>`;
            setTimeout(() => {
                document.getElementById('hud').innerHTML = document.getElementById('hud').innerHTML.replace(/\[.*?\]/g,'');
            }, 1000);
        }

        // --- 昼夜循环 ---
        let timeOfDay = 0; // 0~1, 0=正午, 0.5=午夜
        function updateTime(delta) {
            timeOfDay += delta * 0.01; // 速度
            if (timeOfDay > 1) timeOfDay -= 1;

            const angle = timeOfDay * Math.PI * 2;
            const sunHeight = Math.sin(angle);
            const sunX = Math.cos(angle) * 50;
            const sunZ = Math.sin(angle) * 50;
            sunLight.position.set(sunX, Math.max(10, sunHeight * 50 + 20), sunZ);

            // 颜色
            const brightness = Math.max(0.2, Math.min(1, (sunHeight + 1) / 2));
            const r = 0.8 + 0.2 * brightness;
            const g = 0.7 + 0.3 * brightness;
            const b = 0.6 + 0.4 * brightness;
            sunLight.color.setRGB(r, g, b);
            ambientLight.intensity = 0.3 + 0.4 * brightness;
            scene.background.setHSL(0.6, 0.4, 0.3 + 0.5 * brightness);

            // 显示时间
            const hour = Math.floor(timeOfDay * 24);
            const min = Math.floor((timeOfDay * 24 - hour) * 60);
            document.getElementById('timeDisplay').textContent = `${hour.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}`;
        }

        // --- 更新 HUD 方块计数 ---
        function updateHUD() {
            document.getElementById('blockCount').textContent = Object.keys(blocks).length;
        }

        // --- 动画循环 ---
        function animate() {
            const delta = clock.getDelta();
            // 更新昼夜
            updateTime(delta);

            // 玩家移动 (飞行)
            const speed = 8;
            const forward = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            forward.y = 0;
            forward.normalize();
            const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
            right.y = 0;
            right.normalize();

            const moveVec = new THREE.Vector3(0,0,0);
            if (keys.w) moveVec.add(forward);
            if (keys.s) moveVec.sub(forward);
            if (keys.a) moveVec.sub(right);
            if (keys.d) moveVec.add(right);
            moveVec.y = 0;
            if (moveVec.length() > 0) moveVec.normalize().multiplyScalar(speed * delta);
            if (keys.space) moveVec.y += speed * delta;
            if (keys.shift) moveVec.y -= speed * delta;
            camera.position.add(moveVec);

            // 更新掉落物动画
            for (let i = drops.length-1; i >= 0; i--) {
                const d = drops[i];
                d.position.y += d.userData.vy;
                d.userData.vy -= 0.002;
                d.rotation.x += 0.02;
                d.rotation.z += 0.03;
                d.userData.life--;
                if (d.userData.life <= 0 || d.position.y < -5) {
                    scene.remove(d);
                    drops.splice(i, 1);
                }
            }

            // 更新HUD
            updateHUD();

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        // --- 窗口自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 初始选择第一个
        selectSlot(0);

        console.log('🎮 增强版我的世界已启动！ WASD移动，空格上升，Shift下降，鼠标拖拽视角，左键拆除，右键放置，Q切换模式，数字键选方块。');
    </script>
</body>
</html>
