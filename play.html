<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#5C94FC" />
  <meta name="description" content="超级帽侠：原创像素平台跳跃网页游戏，手机即可畅玩。" />
  <title>超级帽侠 Super Cap Quest</title>
  <link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20shape-rendering%3D%22crispEdges%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%235C94FC%22%2F%3E%0A%20%20%3Crect%20x%3D%2212%22%20y%3D%2218%22%20width%3D%2240%22%20height%3D%2210%22%20fill%3D%22%23B53120%22%2F%3E%0A%20%20%3Crect%20x%3D%228%22%20y%3D%2228%22%20width%3D%2248%22%20height%3D%228%22%20fill%3D%22%23B53120%22%2F%3E%0A%20%20%3Crect%20x%3D%2220%22%20y%3D%2236%22%20width%3D%2224%22%20height%3D%2214%22%20fill%3D%22%23FCA044%22%2F%3E%0A%20%20%3Crect%20x%3D%2224%22%20y%3D%2240%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23181818%22%2F%3E%0A%20%20%3Crect%20x%3D%2236%22%20y%3D%2240%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23181818%22%2F%3E%0A%20%20%3Crect%20x%3D%2218%22%20y%3D%2250%22%20width%3D%2228%22%20height%3D%228%22%20fill%3D%22%231818A8%22%2F%3E%0A%3C%2Fsvg%3E%0A" />
  <style>
:root {
  --sky: #5c94fc;
  --navy: #1a1a40;
  --red: #b53120;
  --gold: #f8d800;
  --panel: rgba(8, 8, 24, 0.72);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: "Press Start", "Courier New", monospace;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

body {
  position: fixed;
  inset: 0;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #000;
}

#stage {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: #000;
}

#game {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  width: min(100vw, calc(100dvh * 256 / 240));
  height: auto;
  max-height: 72dvh;
  background: var(--sky);
  display: block;
  box-shadow: 0 0 0 2px #111, 0 0 40px rgba(92, 148, 252, 0.25);
}

#toast {
  position: absolute;
  left: 50%;
  top: 12%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 2px solid #fff;
  padding: 8px 14px;
  font-size: 12px;
  letter-spacing: 1px;
  pointer-events: none;
}

.hidden {
  display: none !important;
}

.hint {
  text-align: center;
  font-size: 11px;
  letter-spacing: 1px;
  color: #9ab4ff;
  padding: 4px 8px 0;
  flex: 0 0 auto;
}

#controls {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(#141428, #0a0a18);
  border-top: 3px solid #2a2a55;
}

.cluster {
  display: flex;
  align-items: center;
}

.left-cluster { justify-content: flex-start; }
.mid-cluster { justify-content: center; gap: 8px; flex-direction: column; }
.right-cluster { justify-content: flex-end; gap: 14px; }

.dpad {
  display: flex;
  gap: 10px;
}

.pad-btn,
.action-btn,
.sys-btn {
  border: 0;
  color: #fff;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}

.pad-down {
  width: 58px;
  height: 58px;
  align-self: flex-end;
  font-size: 18px;
}

.pad-btn {
  width: 76px;
  height: 76px;
  border-radius: 12px;
  background: linear-gradient(#3a3a58, #1c1c30);
  box-shadow: inset 0 2px 0 #666, 0 6px 0 #090912;
  font-size: 26px;
}

.action-btn {
  width: 82px;
  height: 82px;
  border-radius: 50%;
  font-size: 22px;
  letter-spacing: 1px;
  box-shadow: 0 7px 0 #4a1020;
}

.btn-a {
  background: radial-gradient(circle at 35% 30%, #ff7a6e, #c43028 62%, #8a1810);
}

.btn-b {
  width: 70px;
  height: 70px;
  background: radial-gradient(circle at 35% 30%, #7ad0ff, #2a62d0 62%, #163888);
  box-shadow: 0 7px 0 #102048;
  font-size: 18px;
}

.sys-btn {
  min-width: 64px;
  height: 28px;
  border-radius: 14px;
  background: #2c2c18;
  color: #d0d0a8;
  font-size: 10px;
  letter-spacing: 1px;
  box-shadow: 0 3px 0 #111;
}

.pad-btn:active,
.action-btn:active,
.sys-btn:active,
.pad-btn.held,
.action-btn.held {
  transform: translateY(3px);
  box-shadow: 0 3px 0 #090912;
  filter: brightness(1.15);
}

@media (orientation: landscape) {
  #app {
    display: grid;
    grid-template-columns: 168px 1fr 160px;
    grid-template-rows: 1fr auto;
  }

  #stage {
    grid-column: 2;
    grid-row: 1;
  }

  #game {
    max-height: 96dvh;
    width: min(100%, calc(96dvh * 256 / 240));
  }

  .hint {
    display: none;
  }

  #controls {
    display: contents;
  }

  .left-cluster,
  .right-cluster,
  .mid-cluster {
    background: transparent;
    padding: 0 8px;
  }

  .left-cluster {
    grid-column: 1;
    grid-row: 1;
    align-items: flex-end;
    padding-bottom: 8%;
  }

  .right-cluster {
    grid-column: 3;
    grid-row: 1;
    align-items: flex-end;
    padding-bottom: 8%;
  }

  .mid-cluster {
    grid-column: 2;
    grid-row: 2;
    flex-direction: row;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .pad-btn {
    width: 52px;
    height: 72px;
    background: rgba(30, 30, 50, 0.55);
  }

  .pad-down {
    width: 44px;
    height: 52px;
  }

  .action-btn {
    background-color: rgba(180, 40, 40, 0.8);
  }
}

@media (max-width: 420px) and (orientation: portrait) {
  .pad-btn { width: 64px; height: 64px; }
  .btn-a { width: 70px; height: 70px; }
  .btn-b { width: 60px; height: 60px; }
}

</style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="256" height="240" aria-label="超级帽侠游戏画面"></canvas>
      <div id="toast" class="hidden"></div>
    </div>

    <div id="hud-hint" class="hint">横屏更佳 · A 跳跃 · B 加速/喷火 · ▼ 进水管</div>

    <div id="controls">
      <div class="cluster left-cluster">
        <div class="dpad" id="dpad">
          <button type="button" class="pad-btn" data-btn="left" aria-label="向左">◀</button>
          <button type="button" class="pad-btn pad-down" data-btn="down" aria-label="下蹲或进入水管">▼</button>
          <button type="button" class="pad-btn" data-btn="right" aria-label="向右">▶</button>
        </div>
      </div>
      <div class="cluster mid-cluster">
        <button type="button" class="sys-btn" data-btn="pause" aria-label="暂停">START</button>
        <button type="button" class="sys-btn" data-btn="mute" aria-label="静音">♪</button>
      </div>
      <div class="cluster right-cluster">
        <button type="button" class="action-btn btn-b" data-btn="run" aria-label="奔跑或开火">B</button>
        <button type="button" class="action-btn btn-a" data-btn="jump" aria-label="跳跃">A</button>
      </div>
    </div>
  </div>

  <noscript>请启用 JavaScript 后游玩《超级帽侠》。</noscript>

  <script>
(function (CAP) {
  "use strict";

  const NOTES = {
    C2: 65.41, D2: 73.42, E2: 82.41, F2: 87.31, G2: 98.0, A2: 110.0, B2: 123.47,
    C3: 130.81, D3: 146.83, Eb3: 155.56, E3: 164.81, F3: 174.61, G3: 196.0, A3: 220.0, B3: 246.94,
    C4: 261.63, D4: 293.66, Eb4: 311.13, E4: 329.63, F4: 349.23, Fs4: 369.99, G4: 392.0, A4: 440.0, B4: 493.88,
    C5: 523.25, D5: 587.33, Eb5: 622.25, E5: 659.25, F5: 698.46, Fs5: 739.99, G5: 783.99, A5: 880.0, B5: 987.77,
    C6: 1046.5, D6: 1174.66, E6: 1318.51, F6: 1396.91, G6: 1567.98, A6: 1760.0
  };

  function n(name) {
    return NOTES[name] || 0;
  }

  function createPulseWave(ctx, duty) {
    const harmonics = 32;
    const real = new Float32Array(harmonics);
    const imag = new Float32Array(harmonics);
    for (let i = 1; i < harmonics; i++) {
      imag[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * duty);
    }
    return ctx.createPeriodicWave(real, imag);
  }

  class AudioEngine {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.musicGain = null;
      this.sfxGain = null;
      this.muted = false;
      this.musicEnabled = true;
      this.currentTrack = null;
      this.timer = null;
      this.step = 0;
      this.pulseWave = null;
      this.noiseBuffer = null;
    }

    init() {
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume();
        return;
      }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new Ctx();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.7;
      this.master.connect(this.ctx.destination);

      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.28;
      this.musicGain.connect(this.master);

      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.45;
      this.sfxGain.connect(this.master);

      this.pulseWave = createPulseWave(this.ctx, 0.25);
      this.noiseBuffer = this._makeNoise();
    }

    _makeNoise() {
      const len = this.ctx.sampleRate * 1;
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        if (i % 7 === 0) last = Math.random() * 2 - 1;
        data[i] = last;
      }
      return buf;
    }

    setMuted(m) {
      this.muted = m;
      if (this.master) this.master.gain.value = m ? 0 : 0.7;
    }

    toggleMute() {
      this.setMuted(!this.muted);
      return this.muted;
    }

    _env(node, t, dur, peak, attack, release) {
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      node.connect(g);
      g.connect(this.sfxGain);
      return g;
    }

    _osc(type, freq, t, dur, peak, slideTo) {
      const o = this.ctx.createOscillator();
      if (type === "pulse") {
        o.setPeriodicWave(this.pulseWave);
      } else {
        o.type = type;
      }
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      this._env(o, t, dur, peak, Math.min(0.01, dur / 8), dur * 0.4);
      o.start(t);
      o.stop(t + dur + 0.02);
    }

    _noise(t, dur, peak, freq) {
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuffer;
      src.loop = true;
      const filter = this.ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = freq || 1200;
      filter.Q.value = 0.8;
      src.connect(filter);
      this._env(filter, t, dur, peak, 0.005, dur * 0.5);
      src.start(t);
      src.stop(t + dur + 0.02);
    }

    play(name) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const sfx = this._sfx[name];
      if (sfx) sfx.call(this, t);
    }

    get _sfx() {
      return {
        jump: (t) => {
          this._osc("pulse", 330, t, 0.14, 0.22, 700);
        },
        bounce: (t) => {
          this._osc("square", 280, t, 0.1, 0.18, 520);
        },
        coin: (t) => {
          this._osc("square", 988, t, 0.08, 0.2);
          this._osc("square", 1319, t + 0.08, 0.22, 0.18);
        },
        bump: (t) => {
          this._osc("triangle", 140, t, 0.08, 0.25, 70);
          this._noise(t, 0.06, 0.12, 400);
        },
        break: (t) => {
          this._noise(t, 0.18, 0.28, 900);
          this._osc("square", 200, t, 0.1, 0.1, 60);
        },
        stomp: (t) => {
          this._osc("triangle", 220, t, 0.12, 0.28, 80);
        },
        kick: (t) => {
          this._osc("square", 200, t, 0.08, 0.2, 90);
          this._noise(t, 0.08, 0.15, 600);
        },
        power: (t) => {
          const seq = [262, 330, 392, 523, 392, 523, 659, 784];
          seq.forEach((f, i) => this._osc("square", f, t + i * 0.055, 0.07, 0.16));
        },
        appear: (t) => {
          [392, 523, 659, 784].forEach((f, i) => this._osc("square", f, t + i * 0.05, 0.08, 0.14));
        },
        oneup: (t) => {
          [659, 784, 988, 1047, 988, 1319].forEach((f, i) => this._osc("square", f, t + i * 0.07, 0.09, 0.16));
        },
        fireball: (t) => {
          this._osc("square", 180, t, 0.12, 0.12, 90);
          this._noise(t, 0.08, 0.1, 1800);
        },
        pipe: (t) => {
          this._osc("triangle", 400, t, 0.35, 0.2, 120);
        },
        pause: (t) => {
          this._osc("square", 523, t, 0.08, 0.12);
          this._osc("square", 392, t + 0.1, 0.1, 0.12);
        },
        flag: (t) => {
          const down = [784, 698, 659, 587, 523, 494, 440, 392];
          down.forEach((f, i) => this._osc("square", f, t + i * 0.07, 0.08, 0.14));
        },
        clear: (t) => {
          const fan = [523, 659, 784, 1047, 784, 1047, 1319, 1568];
          fan.forEach((f, i) => this._osc("square", f, t + i * 0.09, 0.12, 0.16));
        },
        die: (t) => {
          this.stopMusic();
          const seq = [659, 622, 587, 554, 523, 494, 466, 440, 392, 330, 262];
          seq.forEach((f, i) => this._osc("square", f, t + i * 0.055, 0.08, 0.18, f * 0.85));
        },
        gameover: (t) => {
          this.stopMusic();
          const seq = [
            [392, 0.2], [0, 0.08], [330, 0.2], [0, 0.08],
            [262, 0.18], [247, 0.18], [262, 0.45]
          ];
          let at = 0;
          seq.forEach(([f, d]) => {
            if (f) this._osc("square", f, t + at, d, 0.16);
            at += d;
          });
        },
        firework: (t) => {
          this._noise(t, 0.25, 0.22, 1400);
          this._osc("square", 880, t, 0.08, 0.1, 400);
        }
      };
    }

    playMusic(track) {
      this.init();
      if (this.currentTrack === track && this.timer) return;
      this.stopMusic();
      this.currentTrack = track;
      const song = SONGS[track];
      if (!song || !this.musicEnabled) return;
      this.step = 0;
      this._schedule(song);
    }

    _schedule(song) {
      const ctx = this.ctx;
      const stepDur = 60 / song.bpm / 4;
      const lookahead = 0.12;
      let next = ctx.currentTime + 0.05;
      const len = song.sq1.length;

      const tick = () => {
        if (!this.timer) return;
        const now = ctx.currentTime;
        while (next < now + lookahead) {
          const i = this.step % len;
          this._note(this.musicGain, "pulse", song.sq1[i], next, stepDur, 0.11);
          this._note(this.musicGain, "square", song.sq2[i], next, stepDur, 0.06);
          this._note(this.musicGain, "triangle", song.tri[i], next, stepDur, 0.14);
          if (song.noise && song.noise[i]) {
            this._musicNoise(next, stepDur * 0.7, song.noise[i]);
          }
          this.step++;
          next += stepDur;
        }
        this.timer = setTimeout(tick, 40);
      };
      this.timer = setTimeout(tick, 0);
    }

    _note(dest, type, freq, t, dur, peak) {
      if (!freq) return;
      const o = this.ctx.createOscillator();
      if (type === "pulse") o.setPeriodicWave(this.pulseWave);
      else o.type = type;
      o.frequency.setValueAtTime(freq, t);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(peak, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.92);
      o.connect(g);
      g.connect(dest);
      o.start(t);
      o.stop(t + dur);
    }

    _musicNoise(t, dur, peak) {
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.value = 1800;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(peak, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filter);
      filter.connect(g);
      g.connect(this.musicGain);
      src.start(t);
      src.stop(t + dur);
    }

    stopMusic() {
      if (this.timer) {
        clearTimeout(this.timer);
        this.timer = null;
      }
      this.currentTrack = null;
    }
  }

  function pat(str) {
    return str.trim().split(/\s+/).map((tok) => (tok === "--" || tok === "0" ? 0 : n(tok)));
  }

  const SONGS = {
    overworld: {
      bpm: 148,
      sq1: pat(`
        G5 E5 C5 E5  G5 A5 G5 E5  F5 D5 B4 D5  F5 G5 F5 D5
        E5 C5 A4 C5  E5 G5 E5 C5  D5 F5 G5 A5  G5 E5 C5 --
        G5 E5 C5 E5  G5 C6 A5 G5  F5 A5 G5 F5  E5 G5 D5 B4
        C5 E5 G5 E5  A5 G5 E5 C5  D5 E5 G5 E5  D5 C5 -- --
      `),
      sq2: pat(`
        E4 G4 C5 G4  E4 G4 C5 G4  D4 F4 B4 F4  D4 F4 B4 F4
        C4 E4 A4 E4  C4 E4 A4 E4  B3 D4 G4 D4  C4 E4 G4 --
        E4 G4 C5 G4  E4 G4 C5 G4  F4 A4 C5 A4  E4 G4 B4 G4
        C4 E4 G4 E4  F4 A4 G4 E4  G3 B3 D4 B3  C4 E4 -- --
      `),
      tri: pat(`
        C3 C3 G3 C3  C3 C3 G3 C3  F3 F3 C3 F3  G3 G3 D3 G3
        A2 A2 E3 A2  A2 A2 E3 A2  G2 G2 D3 G2  C3 G2 C3 --
        C3 C3 G3 C3  C3 C3 G3 C3  F3 F3 C3 F3  E3 E3 B2 E3
        A2 A2 E3 A2  F3 F3 C3 F3  G3 G3 D3 G3  C3 G3 C3 G3
      `),
      noise: (function () {
        const a = new Array(64).fill(0);
        for (let i = 0; i < 64; i++) if (i % 4 === 0) a[i] = 0.04;
        for (let i = 0; i < 64; i++) if (i % 8 === 4) a[i] = 0.07;
        return a;
      })()
    },
    underground: {
      bpm: 112,
      sq1: pat(`
        C4 -- Eb4 --  G4 -- Eb4 --  Ab4 G4 Eb4 C4  -- -- -- --
        B3 -- D4 --   F4 -- D4 --   G4 F4 D4 B3   -- -- -- --
        C4 -- Eb4 --  G4 -- C5 --   B4 G4 Eb4 C4  -- -- -- --
        F4 -- Ab4 --  G4 -- Eb4 --  D4 -- B3 --   C4 -- -- --
      `),
      sq2: pat(`
        G3 -- C4 --   Eb4 -- C4 --  F4 Eb4 C4 G3  -- -- -- --
        F3 -- B3 --   D4 -- B3 --   Eb4 D4 B3 F3  -- -- -- --
        G3 -- C4 --   Eb4 -- G4 --  F4 Eb4 C4 G3  -- -- -- --
        C4 -- F4 --   Eb4 -- C4 --  B3 -- G3 --   G3 -- -- --
      `),
      tri: pat(`
        C3 -- -- --   C3 -- G2 --   Ab2 -- -- --  Ab2 -- Eb2 --
        G2 -- -- --   G2 -- D2 --   C3 -- -- --   G2 -- -- --

    }
    if (e.kind === "flower") e.vx = 0;
    if (e.kind === "star") {
      if (e.vy === 0) e.vy = -3.5;
      moveActor(e, 0.2);
    } else if (e.kind !== "flower") {
      moveActor(e, 0.3);
    }
    if (!player.dead && aabb(player, e)) collectItem(e);
  }

  function collectItem(e) {
    e.dead = true;
    if (e.kind === "mush") {
      if (player.power === 0) {
        player.power = 1;
        save.power = 1;
        player.y -= 16;
        player.h = 32;
        growFlash = 18;
      }
      CAP.audio.play("power");
      addScore(1000, e.x, e.y);
    } else if (e.kind === "flower") {
      player.power = 2;
      save.power = 2;
      if (player.h < 32) {
        player.y -= 16;
        player.h = 32;
      }
      CAP.audio.play("power");
      addScore(1000, e.x, e.y);
    } else if (e.kind === "oneup") {
      save.lives++;
      CAP.audio.play("oneup");
      pops.push({ t: 50, x: e.x, y: e.y, text: "1UP" });
    } else if (e.kind === "star") {
      starT = 480;
      CAP.audio.play("power");
      CAP.audio.playMusic("star");
      addScore(1000, e.x, e.y);
    }
  }

  function collideEnemy(e) {
    if (player.dead || player.pole || e.dead || e.flat) return;
    if (!aabb(player, e)) return;
    if (starT > 0) {
      defeatEnemy(e, true);
      return;
    }
    const feet = player.y + player.h;
    const stomp = !player.onGround && player.vy >= -0.2 && feet <= e.y + 12;
    if (stomp) {
      defeatEnemy(e, false);
      player.vy = inp.jump ? -4.6 : -2.8;
      player.y = e.y - player.h;
      try { navigator.vibrate && navigator.vibrate(12); } catch (err) { /* ignore */ }
      return;
    }
    if (e.kind === "turtle" && e.shell === 1) {
      e.shell = 2;
      e.vx = (player.x + player.w / 2 < e.x + e.w / 2 ? 4 : -4);
      CAP.audio.play("kick");
      invuln = Math.max(invuln, 8);
      return;
    }
    if (e.kind === "turtle" && e.shell === 2 && Math.abs(e.vx) > 1) {
      const fromTop = player.y + player.h - 4 < e.y + 6;
      if (fromTop) return;
    }
    hurtPlayer();
  }

  function updateCamera() {
    const target = player.x - 80;
    if (target > camX) camX = target;
    if (player.x < camX + 24) camX = player.x - 24;
    if (camX < 0) camX = 0;
    const max = world.W * TILE - VIEW_W;
    if (camX > max) camX = Math.max(0, max);
  }

  function updatePlay() {
    if (inp.pausePressed) {
      paused = !paused;
      CAP.audio.play("pause");
      if (paused) CAP.audio.stopMusic();
      else CAP.audio.playMusic(starT ? "star" : world.theme === "underground" ? "underground" : "overworld");
    }
    if (paused) return;
    timeAcc++;
    if (timeAcc >= 24) {
      timeAcc = 0;
      timeLeft--;
      if (timeLeft <= 0) {
        timeLeft = 0;
        killPlayer();
        return;
      }
    }
    updatePlayer();
    updateEnts();
    updateCamera();
  }

  function updateDead() {
    deadT++;
    player.vy += 0.25;
    player.y += player.vy;
    if (deadT > 140) {
      save.lives--;
      save.power = 0;
      if (save.lives < 0) {
        state = "gameover";
        deadT = 0;
        CAP.audio.play("gameover");
      } else {
        state = "start";
        startT = 0;
        loadLevel(save.world);
      }
    }
  }

  function updateClear() {
    clearT++;
    if (clearT < 70) {
      const ground = 13 * TILE - player.h;
      if (player.y < ground) player.y += 2.2;
      else player.y = ground;
    } else if (clearT === 70) {
      CAP.audio.play("clear");
    } else if (clearT < 140) {
      player.facing = 1;
      player.x += 1.4;
      player.walkF += 0.3;
      player.pole = false;
      const ground = 13 * TILE - player.h;
      player.y = ground;
    } else if (timeLeft > 0) {
      timeLeft--;
      save.score += 50;
      if (clearT % 4 === 0) CAP.audio.play("coin");
    } else {
      if (world.spec.next === "win") {
        state = "win";
        clearT = 0;
      } else {
        save.world = world.spec.next;
        state = "start";
        startT = 0;
        loadLevel(save.world);
      }
    }
  }

  function updatePipe() {
    pipeT++;
    player.y += 1.4;
    player.vx = 0;
    if (pipeT > 40) {
      const w = pipeWarp;
      if (w.dest === "1-1" && w.outX) {
        state = "play";
        loadLevel("1-1", { outX: w.outX, outY: w.outY, keepTime: true });
        CAP.audio.play("pipe");
      } else {
        state = "play";
        loadLevel(w.dest);
        CAP.audio.play("pipe");
      }
    }
  }

  function tick() {
    if (inp.mutePressed) {
      const m = CAP.audio.toggleMute();
      showToast(m ? "静音" : "音效开", 60);
    }

    if (state === "title") {
      if (inp.startPressed || inp.jumpPressed || inp.anyPressed) {
        CAP.audio.init();
        save.lives = 3;
        save.coins = 0;
        save.score = 0;
        save.world = "1-1";
        save.power = 0;
        state = "start";
        startT = 0;
        loadLevel("1-1");
      }
    } else if (state === "start") {
      startT++;
      if (startT > 90) {
        state = "play";
        const music = world.theme === "underground" ? "underground" : "overworld";
        CAP.audio.playMusic(music);
        if (world.id === "1-1" && save.lives === 3 && save.score === 0) showToast("水管上按 ▼ 进入", 150);
      }
    } else if (state === "play") updatePlay();
    else if (state === "dead") updateDead();
    else if (state === "clear") updateClear();
    else if (state === "pipe") updatePipe();
    else if (state === "gameover") {
      deadT++;
      if (deadT > 180 && (inp.startPressed || inp.jumpPressed)) {
        state = "title";
        CAP.audio.playMusic("title");
      }
    } else if (state === "win") {
      clearT++;
      if (clearT > 240 && (inp.startPressed || inp.jumpPressed)) {
        state = "title";
        CAP.audio.playMusic("title");
      }
    }

    if (toastT > 0) {
      toastT--;
      if (toastT <= 0) hideToast();
    }
    frame++;
  }

  function skyColor() {
    if (!world) return "#5C94FC";
    return world.theme === "underground" ? "#000000" : "#5C94FC";
  }

  function drawText(x, y, text, scale, color) {
    scale = scale || 1;
    color = color || "#FCFCFC";
    text = String(text).toUpperCase();
    ctx.fillStyle = color;
    for (let i = 0; i < text.length; i++) {
      const g = SPR.font[text[i]] || SPR.font[" "];
      if (!g) continue;
      for (let row = 0; row < g.length; row++) {
        const line = g[row];
        for (let col = 0; col < line.length; col++) {
          if (line[col] === "x") {
            ctx.fillRect(x + (i * 4 + col) * scale, y + row * scale, scale, scale);
          }
        }
      }
    }
  }

  function drawSpr(img, x, y, flipH) {
    if (!img) return;
    const dx = Math.round(x - camX);
    const dy = Math.round(y);
    if (dx + img.width < 0 || dx > VIEW_W) return;
    if (flipH) {
      ctx.save();
      ctx.translate(dx + img.width, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    } else {
      ctx.drawImage(img, dx, dy);
    }
  }

  function tileSprite(c) {
    if (c === "=") return SPR.ground;
    if (c === "#") return SPR.brick;
    if (QBLOCK.test(c)) return (frame >> 3) % 2 ? SPR.q0 : SPR.q1;
    if (c === "X") return SPR.used;
    if (c === "H") return SPR.hard;
    if (c === "p" || c === "v" || c === "W" || c === "w") return SPR.pipeTL;
    if (c === "q") return SPR.pipeTR;
    if (c === "P") return SPR.pipeBL;
    if (c === "Q") return SPR.pipeBR;
    return null;
  }

  function drawWorld() {
    ctx.fillStyle = skyColor();
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    if (world && world.spec.decor) {
      world.spec.decor.forEach((d) => {
        let spr = null;
        if (d.t === "cloud") spr = d.s === 2 ? SPR.cloud2 : SPR.cloud1;
        else if (d.t === "bush") spr = d.s === 3 ? SPR.bush3 : d.s === 2 ? SPR.bush2 : SPR.bush1;
        else if (d.t === "hill") spr = d.s === 2 ? SPR.hill2 : SPR.hill1;
        if (!spr) return;
        const x = d.x * TILE;
        const y = d.t === "cloud" ? d.y * TILE : d.y * TILE - spr.height;
        drawSpr(spr, x, y, false);
      });
    }

    if (!world) return;
    const tx0 = Math.max(0, Math.floor(camX / TILE) - 1);
    const tx1 = Math.min(world.W - 1, Math.floor((camX + VIEW_W) / TILE) + 1);
    for (let ty = 0; ty < world.H; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const c = world.tiles[ty][tx];
        const spr = tileSprite(c);
        if (!spr) continue;
        let oy = 0;
        const b = bump.get(tx + "," + ty);
        if (b) oy = -Math.min(4, b);
        ctx.drawImage(spr, Math.round(tx * TILE - camX), ty * TILE + oy);
      }
    }

    if (world.spec.flagX >= 0) {
      const fx = world.spec.flagX * TILE;
      for (let i = 0; i < 10; i++) {
        ctx.drawImage(SPR.pole, Math.round(fx + 6 - camX), 32 + i * 16);
      }
      const fy = 36 + (state === "clear" ? Math.min(140, clearT * 2.2) : 0);
      drawSpr(SPR.flag, fx - 10, fy, false);
    }
    if (world.spec.castleX) {
      drawSpr(SPR.castle, world.spec.castleX * TILE - 8, 13 * TILE - SPR.castle.height, false);
    }
  }

  function playerSprite() {
    const pack = player.power === 2 ? SPR.fire : player.power === 1 ? SPR.big : SPR.small;
    const left = player.facing < 0;
    if (player.dead) return left ? SPR.small.dieL : SPR.small.die;
    if (!player.onGround && !player.pole) return left ? pack.jumpL : pack.jump;
    if (player.skid) return left ? pack.skidL : pack.skid;
    if (Math.abs(player.vx) > 0.15 && player.onGround) {
      const frames = left ? pack.walkL : pack.walk;
      return frames[(player.walkF | 0) % frames.length];
    }
    return left ? pack.standL : pack.stand;
  }

  function drawEntities() {
    ents.forEach((e) => {
      if (e.kind === "walker") {
        const spr = e.flat ? SPR.walkerFlat : SPR.walker[(frame >> 3) % 2];
        drawSpr(spr, e.x, e.y + (e.flat ? -8 : 0), e.vx > 0);
      } else if (e.kind === "turtle") {
        if (e.shell) drawSpr(SPR.shell, e.x, e.y, false);
        else drawSpr(e.vx > 0 ? SPR.turtleL[(frame >> 3) % 2] : SPR.turtle[(frame >> 3) % 2], e.x, e.y, false);
      } else if (e.kind === "plant") {
        drawSpr(SPR.plant[(frame >> 4) % 2], e.x - 1, e.y, false);
      } else if (e.kind === "coin" || e.kind === "popcoin") {
        drawSpr(SPR.coin[(frame >> 2) % 4], e.x, e.y, false);
      } else if (e.kind === "mush") drawSpr(SPR.mush, e.x, e.y, false);
      else if (e.kind === "oneup") drawSpr(SPR.oneup, e.x, e.y, false);
      else if (e.kind === "flower") drawSpr(SPR.flower[(frame >> 3) % 2], e.x, e.y, false);
      else if (e.kind === "star") drawSpr(SPR.star, e.x, e.y, false);
    });
    fireballs.forEach((f) => drawSpr(SPR.fireball[(f.f >> 1) % 2], f.x, f.y, false));
    particles.forEach((p) => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.t / 40);
      if (p.spr === "brick") ctx.drawImage(SPR.brickBit, Math.round(p.x - camX), p.y);
      ctx.restore();
    });
    pops.forEach((p) => drawText(Math.round(p.x - camX), p.y, p.text, 1, "#FCFCFC"));
  }

  function drawPlayer() {
    if ((invuln > 0 || growFlash > 0) && (frame & 2) && !player.dead) return;
    if (starT > 0 && (frame & 1)) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
    }
    const spr = playerSprite();
    const dx = player.x - (spr.width - player.w) / 2;
    const dy = player.y + player.h - spr.height;
    drawSpr(spr, dx, dy, false);
    if (starT > 0 && (frame & 1)) ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.fillRect(0, 0, VIEW_W, 28);
    drawText(8, 6, "CAP", 1, "#FCFCFC");
    drawText(8, 14, pad(save.score, 6), 1, "#FCFCFC");
    ctx.drawImage(SPR.coin[0], 88, 10);
    drawText(100, 14, "X" + pad(save.coins, 2), 1, "#FCFCFC");
    drawText(160, 6, "WORLD", 1, "#FCFCFC");
    drawText(168, 14, world ? world.id : "1-1", 1, "#FCFCFC");
    drawText(216, 6, "TIME", 1, "#FCFCFC");
    drawText(224, 14, pad(timeLeft, 3), 1, timeLeft < 100 ? "#F83800" : "#FCFCFC");
  }

  function drawTitle() {
    ctx.fillStyle = "#5C94FC";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.drawImage(SPR.hill2, 10, 208 - SPR.hill2.height);
    ctx.drawImage(SPR.bush3, 140, 208 - SPR.bush3.height);
    ctx.drawImage(SPR.cloud2, 160, 24);
    ctx.drawImage(SPR.cloud1, 40, 40);
    for (let x = 0; x < 16; x++) ctx.drawImage(SPR.ground, x * 16, 208);

    drawText(52, 36, "SUPER", 3, "#F83800");
    drawText(40, 58, "CAP QUEST", 3, "#FCFCFC");
    drawText(70, 86, "SUPER CAP QUEST", 1, "#F8D800");

    ctx.drawImage(SPR.small.stand, 78, 192);
    ctx.drawImage(SPR.walker[(frame >> 4) % 2], 148, 192);
    ctx.drawImage(SPR.coin[0], 188, 196);

    if ((frame >> 4) & 1) drawText(52, 112, "TAP OR PRESS START", 1, "#FCFCFC");
    drawText(36, 132, "A JUMP   B RUN FIRE", 1, "#1818A8");
    drawText(16, 228, "ORIGINAL TRIBUTE GAME", 1, "#FCFCFC");
  }

  function drawOverlay() {
    if (state === "start") {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      drawText(88, 80, "WORLD " + save.world, 1, "#FCFCFC");
      ctx.drawImage(SPR.small.stand, 100, 110);
      drawText(122, 118, "X " + Math.max(0, save.lives), 1, "#FCFCFC");
      if (world) drawText(80, 150, world.name, 1, "#F8D800");
    }
    if (state === "play" && paused) {
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      drawText(92, 110, "PAUSED", 2, "#FCFCFC");
    }
    if (state === "gameover") {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      drawText(76, 110, "GAME OVER", 2, "#F83800");
      drawText(64, 150, "TAP TO CONTINUE", 1, "#FCFCFC");
    }
    if (state === "win") {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      drawText(40, 70, "WORLD CLEAR", 2, "#F8D800");
      drawText(52, 110, "THANKS FOR PLAYING", 1, "#FCFCFC");
      drawText(68, 140, "SCORE " + pad(save.score, 6), 1, "#FCFCFC");
      if ((frame >> 4) & 1) drawText(64, 180, "TAP TO TITLE", 1, "#FCFCFC");
      if (clearT % 40 === 10) CAP.audio.play("firework");
    }
  }

  function render() {
    ctx.imageSmoothingEnabled = false;
    if (state === "title") {
      drawTitle();
      return;
    }
    drawWorld();
    drawEntities();
    if (player) drawPlayer();
    drawHUD();
    drawOverlay();
  }

  function loop(t) {
    if (!last) last = t;
    acc += Math.min(100, t - last);
    last = t;
    inp = CAP.input.consume();
    while (acc >= DT) {
      tick();
      acc -= DT;
    }
    render();
    requestAnimationFrame(loop);
  }

  function boot() {
    canvas = document.getElementById("game");
    ctx = canvas.getContext("2d");
    SPR = CAP.buildSprites();
    CAP.input.attach();
    CAP.audio.init();
    try { CAP.audio.playMusic("title"); } catch (e) { /* wait for gesture */ }
    requestAnimationFrame(loop);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(window.CAP = window.CAP || {});

</script>
</body>
</html>
